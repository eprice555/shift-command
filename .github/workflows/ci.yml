name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Vet & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install Ebitengine Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libc6-dev libgl1-mesa-dev libxcursor-dev libxi-dev \
            libxinerama-dev libxrandr-dev libxxf86vm-dev libasound2-dev pkg-config xvfb
      - run: go vet ./...
      - name: go test
        run: xvfb-run -a go test ./...

  web:
    name: Build WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: GOOS=js GOARCH=wasm go vet ./...
      - run: scripts/build-web.sh
      - uses: actions/upload-artifact@v7
        with:
          name: shift-command-web
          path: dist/web
          retention-days: 7
